[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venomshadows-ui"
dynamic = ["version"]
description = "Общий интерфейс сервисов venomshadows: стили, иконки, шаблоны и макросы Jinja"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
venomshadows_ui = [
    "templates/venom_ui/*.html",
    "static/*.css",
    "static/*.js",
    "static/fonts/*",
    "static/img/*.svg",
    "icons/*.svg",
    "icons/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.setuptools.dynamic]
version = { attr = "venomshadows_ui.__version__" }
