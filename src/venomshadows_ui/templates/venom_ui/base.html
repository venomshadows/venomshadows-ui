<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.classList.add('js')</script>
  <title>{% block title %}{{ venom_ui.logo_alt }}{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon/favicon-16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ venom_ui.static('tokens.css') }}">
  <link rel="stylesheet" href="{{ venom_ui.static('ui.css') }}">
  <link rel="stylesheet" href="{{ venom_ui.static('list.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="bg-clouds" aria-hidden="true"></div>
  <div class="bg-rain bg-rain--far" aria-hidden="true"></div>
  <div class="bg-rain bg-rain--near" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  {% block body %}{% endblock %}
  <script src="{{ venom_ui.static('ui.js') }}" defer></script>
  <script src="{{ venom_ui.static('list.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
